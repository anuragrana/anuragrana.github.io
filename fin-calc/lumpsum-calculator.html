<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Lumpsum Calculator | Finance Calculators</title>
  <link rel="stylesheet" href="calc-styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        fontFamily: { sans: ["Inter","ui-sans-serif","system-ui","-apple-system","BlinkMacSystemFont","Segoe UI","sans-serif"] },
        boxShadow: { soft: "0 18px 50px rgba(15,23,42,0.08)" }
      }}
    };
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased transition-colors dark:bg-slate-950 dark:text-slate-100">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="rounded px-1 py-2 text-sm font-semibold text-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-600 dark:text-teal-400">← Home</a>
      <button id="themeToggle" type="button" class="rounded border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 active:scale-[0.98] dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-900" aria-label="Toggle dark mode">
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 sm:py-10">
    <section class="mb-6">
      <p class="mb-2 text-sm font-semibold uppercase tracking-wide text-teal-700 dark:text-teal-400">One-time investment</p>
      <h1 class="text-2xl font-bold tracking-tight text-slate-950 dark:text-white sm:text-4xl">Lumpsum Calculator</h1>
      <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-600 dark:text-slate-300">See how a one-time investment compounds over the years.</p>
    </section>

    <div class="grid gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(320px,0.9fr)]">
      <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-soft dark:border-slate-800 dark:bg-slate-900 sm:p-6">
        <h2 class="mb-5 text-lg font-semibold text-slate-950 dark:text-white">Inputs</h2>
        <form id="calcForm" class="grid gap-5" novalidate>

          <div>
            <label for="amount" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-200">One-Time Investment (₹)</label>
            <input id="amount" type="number" inputmode="decimal" min="1000" max="1000000000" step="1000" value="100000" data-hint="currency"
              class="w-full rounded border border-slate-300 bg-white px-3 py-3 text-base outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100 dark:border-slate-700 dark:bg-slate-950 dark:focus:ring-teal-950">
          </div>

          <div>
            <label for="cagr" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-200">Expected CAGR <span class="font-normal text-slate-400">% p.a.</span></label>
            <div class="flex items-stretch overflow-hidden rounded-lg border border-slate-300 bg-white dark:border-slate-700 dark:bg-slate-950">
              <button type="button" class="w-12 flex-shrink-0 border-r border-slate-200 bg-slate-50 text-xl font-semibold text-slate-600 transition hover:bg-slate-100 active:scale-95 select-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800" data-target="cagr" data-step="-0.5">−</button>
              <input id="cagr" type="number" inputmode="decimal" min="1" max="30" step="0.5" value="12" class="stepper-input w-full bg-transparent py-3 text-center text-2xl font-bold text-teal-700 outline-none dark:text-teal-400">
              <button type="button" class="w-12 flex-shrink-0 border-l border-slate-200 bg-slate-50 text-xl font-semibold text-slate-600 transition hover:bg-slate-100 active:scale-95 select-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800" data-target="cagr" data-step="0.5">+</button>
            </div>
          </div>

          <div>
            <label for="years" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-200">Duration <span class="font-normal text-slate-400">years</span></label>
            <div class="flex items-stretch overflow-hidden rounded-lg border border-slate-300 bg-white dark:border-slate-700 dark:bg-slate-950">
              <button type="button" class="w-12 flex-shrink-0 border-r border-slate-200 bg-slate-50 text-xl font-semibold text-slate-600 transition hover:bg-slate-100 active:scale-95 select-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800" data-target="years" data-step="-1">−</button>
              <input id="years" type="number" inputmode="numeric" min="1" max="40" step="1" value="10" class="stepper-input w-full bg-transparent py-3 text-center text-2xl font-bold text-teal-700 outline-none dark:text-teal-400">
              <button type="button" class="w-12 flex-shrink-0 border-l border-slate-200 bg-slate-50 text-xl font-semibold text-slate-600 transition hover:bg-slate-100 active:scale-95 select-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800" data-target="years" data-step="1">+</button>
            </div>
          </div>

          <div id="errorBox" class="hidden rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-200" role="alert"></div>

          <div class="grid grid-cols-2 gap-3 pt-1">
            <button type="submit" class="rounded bg-teal-700 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-800 active:scale-[0.98]">Calculate</button>
            <button id="resetBtn" type="button" class="rounded border border-slate-300 px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 active:scale-[0.98] dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Reset</button>
          </div>
        </form>
      </section>

      <section class="space-y-4">
        <div class="rounded-lg border border-teal-200 bg-teal-50 p-4 shadow-soft dark:border-teal-900 dark:bg-teal-950">
          <p class="text-xs font-semibold uppercase tracking-wide text-teal-800 dark:text-teal-300">Final value</p>
          <p id="summaryValue" class="mt-1 text-3xl font-bold text-teal-950 dark:text-teal-100">—</p>
          <p id="summaryText" class="mt-1.5 text-sm leading-5 text-teal-900 dark:text-teal-200">Enter investment details to calculate.</p>
        </div>

        <div id="results" class="grid gap-3 sm:grid-cols-2" aria-live="polite"></div>

        <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-soft dark:border-slate-800 dark:bg-slate-900">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h2 class="text-base font-semibold text-slate-950 dark:text-white">Growth curve</h2>
            <button id="shareBtn" type="button" class="rounded border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Copy</button>
          </div>
          <div class="h-56"><canvas id="mainChart" role="img" aria-label="Lumpsum growth curve"></canvas></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="mx-auto max-w-5xl px-4 pb-8 text-xs leading-5 text-slate-500 dark:text-slate-400 sm:px-6">
    CAGR is assumed constant. Actual market returns fluctuate and past performance is not a guarantee.
  </footer>

  <script src="calc-engine.js"></script>
  <script>
    (function () {
      var chart = null;
      var lastResultText = "";
      var storageKey = "lumpsumCalcInputs";
      var root = document.documentElement;
      var form = document.getElementById("calcForm");
      var errorBox = document.getElementById("errorBox");

      function applyTheme(theme) {
        root.classList.toggle("dark", theme === "dark");
        document.getElementById("themeLabel").textContent = theme === "dark" ? "Light" : "Dark";
        localStorage.setItem("financeCalculatorsTheme", theme);
      }

      function saveInputs(v) { localStorage.setItem(storageKey, JSON.stringify(v)); }

      function restoreInputs() {
        var saved = localStorage.getItem(storageKey);
        if (!saved) return;
        try {
          var v = JSON.parse(saved);
          Object.keys(v).forEach(function (k) { var el = document.getElementById(k); if (el) el.value = v[k]; });
        } catch (e) { localStorage.removeItem(storageKey); }
      }

      function getInputs() {
        return { amount: Utils.readNumber("amount"), cagr: Utils.readNumber("cagr"), years: Utils.readNumber("years") };
      }

      function validate(v) {
        return [
          Utils.validateRange("Investment amount", v.amount, 1000, 1000000000),
          Utils.validateRange("CAGR", v.cagr, 1, 30),
          Utils.validateRange("Duration", v.years, 1, 40)
        ].filter(Boolean);
      }

      function calculate(v) {
        var finalVal = Calc.lumpsumFV(v.amount, v.cagr, v.years);
        var absReturn = finalVal - v.amount;
        return { finalVal: finalVal, absReturn: absReturn, multiplier: finalVal / v.amount };
      }

      function tile(label, value, highlight) {
        return '<article class="rounded-lg border ' +
          (highlight ? 'border-teal-300 bg-teal-50 dark:border-teal-800 dark:bg-teal-950' : 'border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900') +
          ' p-4 shadow-soft"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">' +
          label + '</p><p class="mt-2 text-xl font-bold text-slate-950 dark:text-white">' + value + '</p></article>';
      }

      function renderResults(v, r) {
        document.getElementById("summaryValue").textContent = Utils.formatCompact(r.finalVal);
        document.getElementById("summaryText").textContent =
          Utils.formatCompact(v.amount) + " at " + v.cagr + "% CAGR for " + v.years + " years";

        document.getElementById("results").innerHTML =
          tile("Final value", Utils.formatCompact(r.finalVal), true) +
          tile("Absolute return", Utils.formatCompact(r.absReturn), false) +
          tile("Wealth multiplier", r.multiplier.toFixed(2) + "×", false) +
          tile("Return on investment", Utils.formatPercent(r.absReturn / v.amount * 100, 1), false);

        lastResultText = "Lumpsum Calculator\nInvestment: " + Utils.formatCurrency(v.amount) +
          "\nCAGR: " + v.cagr + "% | Duration: " + v.years + " years" +
          "\nFinal Value: " + Utils.formatCurrency(r.finalVal) +
          "\nAbsolute Return: " + Utils.formatCurrency(r.absReturn) +
          "\nWealth Multiplier: " + r.multiplier.toFixed(2) + "x";
      }

      function renderChart(v, r) {
        var labels = [], values = [];
        for (var y = 0; y <= v.years; y++) {
          labels.push(y === 0 ? "Now" : "Yr " + y);
          values.push(Utils.round(Calc.lumpsumFV(v.amount, v.cagr, y), 0));
        }
        var ctx = document.getElementById("mainChart");
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
          type: "line",
          data: { labels: labels, datasets: [{ label: "Value", data: values, borderColor: "#0f766e", backgroundColor: "rgba(15,118,110,0.12)", fill: true, tension: 0.3, pointRadius: v.years > 20 ? 0 : 3 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return Utils.formatCurrency(c.raw); } } } },
            scales: { y: { beginAtZero: false, ticks: { callback: function (v) { return Utils.formatCompact(v); } } } }
          }
        });
      }

      function recalculate(e) {
        if (e && e.type === "submit") e.preventDefault();
        var v = getInputs();
        var errs = validate(v);
        if (errs.length) { errorBox.textContent = errs[0]; errorBox.classList.remove("hidden"); return; }
        errorBox.classList.add("hidden");
        saveInputs(v);
        var r = calculate(v);
        renderResults(v, r);
        renderChart(v, r);
      }

      document.getElementById("themeToggle").addEventListener("click", function () { applyTheme(root.classList.contains("dark") ? "light" : "dark"); });
      document.getElementById("resetBtn").addEventListener("click", function () {
        localStorage.removeItem(storageKey); form.reset(); recalculate();
      });
      document.getElementById("shareBtn").addEventListener("click", function () {
        var btn = this;
        var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(lastResultText) : Promise.reject();
        p.then(function () { btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = "Copy"; }, 1500); }).catch(function () { alert(lastResultText); });
      });

      Stepper.init(form);
      Utils.initHints(form);
      form.addEventListener("submit", recalculate);
      form.addEventListener("input", recalculate);

      var savedTheme = localStorage.getItem("financeCalculatorsTheme");
      applyTheme(savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      restoreInputs();
      recalculate();
    })();
  </script>
</body>
</html>
